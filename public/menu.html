<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Hunger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Hunger</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#testimonials">Testimonials</a></li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="modal" data-bs-target="#cartModal">
                            Cart <span class="badge bg-primary rounded-pill" id="cart-item-count">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><button type="button" class="btn theme-toggle-btn ms-2" data-theme-toggle>Dark Mode</button></li>
                    <div id="logged-out-links" style="display: flex;">
                        <li class="nav-item"><a class="btn btn-primary ms-2" href="signup.html">Sign Up</a></li>
                        <li class="nav-item"><a class="btn btn-outline-primary ms-2" href="login.html">Log In</a></li>
                    </div>
                    <div id="logged-in-links" style="display: none;">
                        <li class="nav-item"><a class="nav-link" id="welcome-message"></a></li>
                        <li class="nav-item"><button class="btn btn-danger ms-2" onclick="logout()">Log Out</button></li>
                        <li class="nav-item"><a class="btn btn-primary ms-2" href="checkout.html">Checkout</a></li>
                    </div>
                </ul>
            </div>
        </div>
    </nav>

    <section id="menu" class="container mt-5">
        <h2 class="text-center menu-title">Crafted For Your Cravings</h2>
        <div class="container mt-4">
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="search-input" placeholder="Search for food items...">
            </div>
        </div>
        <div class="row g-4" id="menu-items-container">
            </div>
    </section>

    <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cartModalLabel">Your Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul id="cart-items" class="list-group">
                        </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 mt-5">
        <p>&copy; 2025 Hunger. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="theme.js"></script>
    <script src="scripts.js"></script>
    <script src="auth.js"></script>
</body>
</html>
