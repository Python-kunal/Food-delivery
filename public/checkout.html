<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Hunger</a>
            <div class="d-flex align-items-center gap-2">
                <a class="btn btn-outline-primary" href="menu.html">Back To Menu</a>
                <button type="button" class="btn theme-toggle-btn" data-theme-toggle>Dark Mode</button>
            </div>
        </div>
    </nav>

    <main class="container checkout-shell">
        <div class="row g-4">
            <div class="col-lg-7">
                <section class="checkout-card checkout-summary h-100">
                    <h1>Order Summary</h1>
                    <div class="table-responsive">
                        <table class="table mt-3 align-middle">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Price</th>
                                </tr>
                            </thead>
                            <tbody id="order-summary"></tbody>
                        </table>
                    </div>
                    <div class="checkout-total mt-3">Total: ₹<span id="total-price">0</span></div>
                </section>
            </div>

            <div class="col-lg-5">
                <section class="checkout-card checkout-customer h-100">
                    <h2>Customer Information</h2>
                    <p class="mb-4">Please enter accurate details for smooth delivery.</p>
                    <form id="customer-form" class="d-grid gap-3">
                        <div>
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div>
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" required>
                        </div>
                        <div>
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>
                        <button type="button" class="btn btn-success mt-2" id="confirm-order">Confirm Order</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="theme.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
